<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Profile card component</title>
    <meta
      name="description"
      content="A responsive profile card component featuring Victor Crest, a 26-year-old from London. Displays profile information, followers, likes, and photos using a modern and minimalist design."
    />

    <meta
      name="keywords"
      content="Profile Card, Profile Card Component, HTML, CSS, Responsive Design, Frontend Development."
    />
    <meta name="author" content="Sebastian" />
    <meta name="title" content="Profile card component" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Profile card component" />
    <meta
      property="og:description"
      content="Explore a modern and responsive profile card component featuring Victor Crest, including profile details, followers, likes, and photos."
    />
    <meta
      property="og:image"
      content="https://previewcomponentcardnft.netlify.app/images/NFT-preview-card-component.png"
    />
    <meta
      property="og:url"
      content=""
    />
    <meta property="og:site_name" content="Profile card component" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <article class="card">
        <header class="card__header">
          <img src="./images/image-victor.jpg" alt="profile's photo" />
        </header>
        <h1 class="card__title">Victor Crest</h1>
        <p class="card__profile-age">26</p>
        <h2 class="card__subtitle">London</h2>
        <hr />
        <footer class="card__footer">
          <p>80K <span>Followers</span></p>
          <p>803K <span>Likes</span></p>
          <p>1.4K <span>Photos</span></p>
        </footer>
      </article>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Sebastian</a>.
    </footer>
  </body>
</html>
